# Render blueprint for the Lumen RAG API (free tier).
# 1. Push this folder as a GitHub repo (repo root = this folder).
# 2. In Render: New -> Blueprint -> point at the repo.
# 3. Set GEMINI_API_KEY (free key: https://aistudio.google.com/apikey).
# 4. Set RAG_CORS_ORIGINS to your frontend URL (e.g. https://<user>.github.io).
#
# Note: free disks are ephemeral — uploads vanish on restart/redeploy.
# SEED_DIR pre-loads data/sample so the public demo always has content.
services:
  - type: web
    name: lumen-rag-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: HF_API_TOKEN
        sync: false
      - key: RAG_CORS_ORIGINS
        value: https://bharath609.github.io
      - key: SEED_DIR
        value: data/sample
      - key: TOP_K
        value: 4
      - key: MIN_SCORE
        value: "0.25"
