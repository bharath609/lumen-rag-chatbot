# Render blueprint for the Lumen RAG API (free tier).
# 1. Push this folder as a GitHub repo (repo root = this folder).
# 2. In Render: New -> Blueprint -> point at the repo.
# 3. Set GEMINI_API_KEY (free key: https://aistudio.google.com/apikey).
# 4. Set Supabase Auth variables in Render Environment.
#
# Vector embeddings use the configured persistent Chroma Cloud index. Uploaded
# source files are parsed and indexed; account isolation is enforced by Supabase
# access tokens plus user_id metadata in the vector index.
services:
  - type: web
    name: lumen-rag-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MAX_RETRIES
        value: 2
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: RAG_CORS_ORIGINS
        value: https://bharath609.github.io
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SEED_DIR
        value: ""
      - key: TOP_K
        value: 4
      - key: MIN_SCORE
        value: "0.25"
